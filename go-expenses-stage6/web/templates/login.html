<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Вход</title>
    <style>
        body { font-family: Arial; max-width: 400px; margin: 50px auto; padding: 20px; }
        input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #3498db; color: white; border: none; cursor: pointer; font-size: 16px; border-radius: 4px; }
        .error { color: red; margin-bottom: 10px; padding: 10px; background: #fde8e8; border-radius: 4px; }
    </style>
</head>
<body>
    <h2>Вход в систему</h2>
    {{if .Error}}<div class="error">{{.Error}}</div>{{end}}
    <form method="POST" action="/login">
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Пароль" required>
        <button type="submit">Войти</button>
    </form>
    <p style="text-align: center; margin-top: 20px;">Нет аккаунта? <a href="/register">Зарегистрироваться</a></p>
</body>
</html>
