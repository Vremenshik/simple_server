<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Список трат</title>
    <style>
        body { font-family: Arial; max-width: 900px; margin: 20px auto; padding: 0 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; }
        nav a { margin-right: 15px; color: #3498db; text-decoration: none; font-weight: bold; }
        .filter-box { background: #f9f9f9; padding: 15px; margin-bottom: 20px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 10px; }
        th { background: #ecf0f1; }
        .btn { padding: 6px 12px; background: #27ae60; color: white; text-decoration: none; border-radius: 4px; }
        .btn-del { background: #e74c3c; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Мои траты</h1>
        <div>
            <a href="/logout" style="color: #e74c3c;">Выйти</a>
        </div>
    </div>
    
    <nav>
        <a href="/">Список</a>
        <a href="/add">Добавить</a>
    </nav>
    <hr>

    <div class="filter-box">
        <form method="GET" action="/">
            <select name="category">
                <option value="">Все категории</option>
                {{range .Categories}}
                    <option value="{{.ID}}" {{if eq .ID $.SelectedCategory}}selected{{end}}>{{.Name}}</option>
                {{end}}
            </select>
            <input type="date" name="from" value="{{.FromDate}}">
            <input type="date" name="to" value="{{.ToDate}}">
            <button type="submit">Фильтровать</button>
            <a href="/">Сбросить</a>
        </form>
    </div>

    {{if .Expenses}}
    <table>
        <tr><th>Сумма</th><th>Описание</th><th>Дата</th><th>Категория</th><th></th></tr>
        {{range .Expenses}}
        <tr>
            <td>{{.Amount}} ₽</td>
            <td>{{.Description}}</td>
            <td>{{.Date}}</td>
            <td>{{if .CategoryName}}{{.CategoryName}}{{else}}—{{end}}</td>
            <td>
                <a class="btn" href="/edit?id={{.ID}}">✏️</a>
                <a class="btn btn-del" href="/delete?id={{.ID}}" onclick="return confirm('Удалить?')">🗑</a>
            </td>
        </tr>
        {{end}}
    </table>
    {{else}}
    <p>Трат пока нет.</p>
    {{end}}
</body>
</html>
